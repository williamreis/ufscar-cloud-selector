services:
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: cloud_backend
    working_dir: /app/app
    env_file:
      - ./backend/.env
    ports:
      - "8001:8000"
    volumes:
      - ./backend/app:/app/app
      # ./backend/data já cobre data/faiss_index, data/pdf e data/upload —
      # não é necessário um bind mount extra por subpasta.
      - ./backend/data:/app/data
      - ./backend/scripts:/app/scripts
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: cloud_frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8501:80"
    volumes:
      # Editável sem rebuild: sobrescreve o questions.json que foi embutido no build.
      - ./frontend/public/questions.json:/usr/share/nginx/html/questions.json
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
