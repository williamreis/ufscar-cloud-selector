server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    # Proxy same-origin para o backend (evita configurar CORS/URLs absolutas no cliente).
    location /api/ {
        proxy_pass http://cloud_backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Atrás do Traefik o esquema real é https; sem repassar, o backend só
        # enxerga o http do salto interno.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
    }

    # SPA: qualquer rota desconhecida cai no index.html (React Router assume o roteamento).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
