server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    # Proxy same-origin para o backend (evita configurar CORS/URLs absolutas no cliente).
    location /api/ {
        proxy_pass http://cloud_backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # SPA: qualquer rota desconhecida cai no index.html (React Router assume o roteamento).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
