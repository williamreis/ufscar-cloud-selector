server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    # Proxy same-origin para o backend (evita configurar CORS/URLs absolutas no cliente).
    location /api/ {
        proxy_pass http://cloud_backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Atrás do Traefik o esquema real é https; sem repassar, o backend só
        # enxerga o http do salto interno.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        # O /api/recommend faz uma chamada à LLM por (provedor × dimensão) e,
        # em camada gratuita, uma avaliação inteira mede 3 a 4 minutos. Com 300s
        # o nginx cortava perto do fim e o gestor perdia o trabalho todo. O teto
        # do cliente (RECOMMEND_TIMEOUT_MS, em src/api.ts) acompanha este valor.
        proxy_read_timeout 600s;
    }

    # SPA: qualquer rota desconhecida cai no index.html (React Router assume o roteamento).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
